name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  SUPABASE_CLI_VERSION: 2.120.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --passWithNoTests

  database:
    name: Database & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Match production's Postgres image. 17.6.1.106 segfaults when a role calls a
      # function it lacks EXECUTE on (supautils bug), which these tests do on purpose.
      - name: Pin Postgres image to production version
        run: mkdir -p supabase/.temp && echo 17.6.1.063 > supabase/.temp/postgres-version

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Run pgTAP tests
        run: supabase test db

      # lib/db/schema.ts must match what the migrations produce.
      - name: Check Drizzle schema is up to date
        run: npm run db:check

      # Client lockdown + service/repository tests against real Postgres (as app_server),
      # including concurrency tests.
      - name: Run integration tests
        run: npm run test:int

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  changes:
    name: Detect migration changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/migrations/**'

  # Manual: bound to the `Preview` environment, whose required reviewer must approve each run
  # (PR checks → "Review deployments"). All PRs share one non-prod DB, so you pick which PR gets it.
  migrate-preview:
    name: Migrate preview DB
    needs: [changes, database]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: Preview
    concurrency:
      group: migrate-preview
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Another (or an abandoned) PR's migrations on the DB → run the "Reset preview DB" workflow.
      - name: Check for foreign migrations
        run: tools/preview-db.sh check-drift

      # --include-all: this PR's migration may predate ones already applied from main.
      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

  # Automatic on main. Vercel Deployment Checks wait for this job before promoting to production.
  migrate-production:
    name: Migrate production DB
    needs: [lint, type-check, test, database, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
