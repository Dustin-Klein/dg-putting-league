version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

    # Minor and patch bumps are grouped so they stay easy to merge in bulk.
    # Major bumps are deliberately left ungrouped so each arrives as its own
    # PR: the previous single catch-all group mixed majors with patches, which
    # is how a styling regression landed without being attributable to a
    # specific dependency.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react
      # still calls; eslint-config-next depends on that plugin and there is no
      # compatible plugin release. See the note in eslint.config.mjs.
      - dependency-name: "eslint"
        versions: ["10.x"]
      # typescript-eslint (via eslint-config-next/typescript) peers on
      # typescript <6.1.0, and TS 7's native compiler drops the classic
      # compiler API that typescript-eslint and next build load. package.json
      # pins ~6.0.3; revisit when typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      all-github-actions:
        patterns:
          - "*"
