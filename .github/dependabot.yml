version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    # Two hours ahead of the devbox job that merges these PRs (03:00 Central,
    # Monday to Wednesday: homelab kubernetes/apps/devbox/crontab.yaml), so CI
    # has finished by then. Unpinned, the weekly run drifts across the day.
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10

    # Wait before proposing a fresh release: a compromised or broken publish is
    # usually yanked within days, and these PRs are merged by a nightly agent
    # (.claude/skills/dependabot-merge).
    cooldown:
      default-days: 3
      semver-major-days: 7

    # Minor and patch bumps are grouped so they stay easy to merge in bulk.
    # Major bumps are deliberately left ungrouped so each arrives as its own
    # PR: the previous single catch-all group mixed majors with patches, which
    # is how a styling regression landed without being attributable to a
    # specific dependency.
    # A dependency joins the first group that matches it. @radix-ui/* and
    # @types/* release in bursts of many packages; grouping them (majors
    # included) keeps one PR per family, and a regression is still
    # attributable to that family.
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      types:
        patterns:
          - "@types/*"
      # react and react-dom must be the exact same version (React throws
      # "Incompatible React versions" otherwise), so they have to land in
      # the same PR.
      react:
        patterns:
          - "react"
          - "react-dom"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # ESLint 10 removed context.getFilename(), which eslint-plugin-react
      # still calls; eslint-config-next depends on that plugin and there is no
      # compatible plugin release. See the note in eslint.config.mjs.
      - dependency-name: "eslint"
        versions: ["10.x"]
      # typescript-eslint (via eslint-config-next/typescript) peers on
      # typescript <6.1.0, and TS 7's native compiler drops the classic
      # compiler API that typescript-eslint and next build load. package.json
      # pins ~6.0.3; revisit when typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "America/Chicago"

    cooldown:
      default-days: 3

    groups:
      all-github-actions:
        patterns:
          - "*"
